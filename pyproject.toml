[project]
name = "forumboard"
version = "0.2.0"
description = "Reviews claude.ai conversations into a redacted Notion discussion archive and a rewritten current worldview"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = [
    "agent",
    "ai",
    "claude",
    "conversations",
    "llm",
    "notion",
    "redaction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "lup[claude,codex,web]",
    "notion-client>=3.1.0",
    "packaging>=26.2",
    "playwright>=1.62.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
    "pyvirtualdisplay>=3.0",
    "sh>=2.4.0",
    "tomlkit>=0.15.0",
    "typer>=0.21.1",
    "tzlocal>=5.4.3",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
forumboard = "forumboard.environment.cli.__main__:app"
lup-devtools = "forumboard.devtools.main:app"

[project.urls]
Homepage = "https://github.com/joy-void-joy/llm-forumboard"
Repository = "https://github.com/joy-void-joy/llm-forumboard"
Issues = "https://github.com/joy-void-joy/llm-forumboard/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forumboard.devtools.dashboard" = ["assets/*.html"]
"forumboard.devtools.harness.content" = ["assets/*.js", "assets/*.sh"]

[tool.lup]
agent_version = "0.2.0"

[tool.uv]
exclude-newer = "3 days"

[tool.uv.sources]
lup = {git = "https://github.com/joy-void-joy/lup", branch = "dev", subdirectory = "packages/lup"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = ["integration: tests requiring external services (Docker, APIs)"]

[tool.pyright]
# Workspace-wide check, run from the repo root: the template (src), the
# vendored lup library (packages/lup/src), tests, the runnable examples that
# document composition, and the generated plugin hook trees. Pyright reads
# only this root config when invoked here — it does not discover the member
# config in packages/lup/pyproject.toml — so every include the workspace
# needs is listed.
include = ["src", "tests", "examples", ".claude/plugins/lup/hooks", ".codex/plugins/lup/hooks"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

# `kernel`, `policy_data`, and `codex_patch` are top-level modules only inside
# a generated plugin's `hooks/runtime`. Naming that directory as the search
# path checks each dispatcher — the canonical asset and the script compiled
# from it — against the exact runtime it is shipped beside. `host` is the half
# the compiler links in rather than ships, so an asset resolves it against the
# canonical module both scripts are compiled from.
[[tool.pyright.executionEnvironments]]
root = ".claude/plugins/lup/hooks/scripts"
extraPaths = [".claude/plugins/lup/hooks/runtime"]

[[tool.pyright.executionEnvironments]]
root = ".codex/plugins/lup/hooks/scripts"
extraPaths = [".codex/plugins/lup/hooks/runtime"]
[tool.ruff]
# Pinned below requires-python (>=3.14) so ruff keeps `except (A, B):`
# parenthesized. Inferring py314 would treat the parens as redundant and
# strip them, since `except A, B:` is valid syntax from 3.14 on.
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# A dispatcher half is compiled, not imported: only its import block is
# emitted into the generated script, so it must carry every module the shared
# host half stands on. `lup.policy.dispatcher` proves that carry and fails
# generation when one is missing — an import unused in this file alone is the
# requirement being met, not a leftover.
"packages/lup/src/lup/adapters/*/assets/policy_dispatcher.py" = ["F401"]
