<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lup setup</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #11151d;
        --panel-raised: #171c26;
        --border: #272e3d;
        --text: #edf1f7;
        --muted: #8e98aa;
        --accent: #9b8cff;
        --accent-strong: #b9adff;
        --ok: #64d6a2;
        --danger: #ff8292;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% -10%, #26204b 0, transparent 34rem),
          radial-gradient(circle at 90% 5%, #15344a 0, transparent 30rem),
          var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input { font: inherit; }

      .shell {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: end;
        margin-bottom: 26px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.045em; }
      h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
      p { margin: 0; }

      .lede { max-width: 620px; margin-top: 8px; color: var(--muted); }

      .view-toggle {
        display: flex;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: #0c1017;
      }

      .view-toggle button {
        border: 0;
        border-radius: 7px;
        padding: 7px 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .view-toggle button.active { background: var(--panel-raised); color: var(--text); }

      .progress-card {
        margin-bottom: 18px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        box-shadow: 0 18px 70px #0005;
      }

      .progress-row { display: flex; justify-content: space-between; gap: 16px; }
      .progress-label { color: var(--muted); }
      .progress-count { font-variant-numeric: tabular-nums; font-weight: 700; }

      .progress-track {
        height: 7px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 99px;
        background: #252a35;
      }

      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #62c7d9);
        transition: width .3s ease;
      }

      .step-dots { display: flex; gap: 7px; margin: 14px 0 0; }

      .step-dot {
        flex: 1;
        height: 4px;
        border: 0;
        border-radius: 99px;
        background: #292f3c;
        cursor: pointer;
      }

      .step-dot.done { background: var(--ok); }
      .step-dot.active { background: var(--accent-strong); }

      .integration {
        margin-bottom: 14px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: linear-gradient(145deg, #141923, #10141c);
      }

      .integration-head {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-start;
      }

      .integration-help { margin-top: 5px; color: var(--muted); }

      .status {
        flex: none;
        border: 1px solid #4a3340;
        border-radius: 99px;
        padding: 5px 10px;
        color: var(--danger);
        font-size: 12px;
        font-weight: 700;
      }

      .status.ok { border-color: #27513f; color: var(--ok); }
      .detail { margin: 18px 0; color: var(--muted); }
      .detail code, .command { color: var(--text); }

      form { display: grid; gap: 13px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        padding: 10px 12px;
        background: #0b0f15;
        color: var(--text);
      }

      input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #9b8cff1f; }

      button.primary, button.secondary {
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
      }

      button.primary {
        border: 1px solid #8d7df3;
        background: var(--accent);
        color: #0d0b18;
        font-weight: 760;
      }

      button.primary:disabled { cursor: wait; opacity: .55; }

      button.secondary {
        border: 1px solid var(--border);
        background: var(--panel-raised);
        color: var(--text);
      }

      .command {
        display: block;
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        background: #090c11;
        white-space: nowrap;
      }

      .nav { display: flex; justify-content: space-between; margin-top: 17px; }
      .nav-right { display: flex; gap: 8px; }
      .error { color: var(--danger); }
      .loading { padding: 60px 20px; text-align: center; color: var(--muted); }

      footer { margin-top: 25px; color: var(--muted); font-size: 13px; }

      @media (max-width: 640px) {
        .shell { padding-top: 30px; }
        header { grid-template-columns: 1fr; align-items: start; }
        .view-toggle { width: max-content; }
        .integration-head { display: grid; }
        .status { width: max-content; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <p class="eyebrow">Lup devtools</p>
          <h1>Project setup</h1>
          <p class="lede">Configure the same integration registry exposed by the terminal wizard.</p>
        </div>
        <div class="view-toggle" aria-label="Dashboard view">
          <button id="wizard-view" class="active" type="button">Setup</button>
          <button id="all-view" type="button">All</button>
        </div>
      </header>

      <section class="progress-card" aria-label="Setup progress">
        <div class="progress-row">
          <span class="progress-label">Configured integrations</span>
          <span id="progress-count" class="progress-count">—</span>
        </div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="step-dots" class="step-dots"></div>
      </section>

      <main id="content"><div class="loading">Loading setup registry…</div></main>
      <footer>Secrets stay in <code>.env.local</code>. Bespoke flows continue in their CLI wizard.</footer>
    </div>

    <script>
      const content = document.getElementById("content");
      const progressCount = document.getElementById("progress-count");
      const progressFill = document.getElementById("progress-fill");
      const stepDots = document.getElementById("step-dots");
      const wizardButton = document.getElementById("wizard-view");
      const allButton = document.getElementById("all-view");

      let state = null;
      let view = localStorage.getItem("lup-dashboard-view") || "wizard";
      let active = Number(localStorage.getItem("lup-dashboard-step") || 0);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function fieldMarkup(field) {
        const type = field.secret ? "password" : "text";
        return `<label>${escapeHtml(field.prompt)}<input name="${escapeHtml(field.key)}" type="${type}" autocomplete="off" /></label>`;
      }

      function integrationMarkup(item) {
        const status = item.configured ? "Configured" : "Not configured";
        const body = item.mode === "form"
          ? `<form data-command="${escapeHtml(item.command)}">${item.fields.map(fieldMarkup).join("")}<button class="primary" type="submit">Save settings</button><p class="error" hidden></p></form>`
          : `<p>Complete this workflow in the terminal:</p><code class="command">uv run lup-devtools setup ${escapeHtml(item.command)}</code>`;
        return `<article class="integration"><div class="integration-head"><div><h2>${escapeHtml(item.name)}</h2><p class="integration-help">${escapeHtml(item.help)}</p></div><span class="status ${item.configured ? "ok" : ""}">${status}</span></div><p class="detail">Current: <code>${escapeHtml(item.detail)}</code></p>${body}</article>`;
      }

      function bindForms() {
        document.querySelectorAll("form[data-command]").forEach((form) => {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = form.querySelector("button[type=submit]");
            const error = form.querySelector(".error");
            const values = Object.fromEntries(new FormData(form).entries());
            button.disabled = true;
            error.hidden = true;
            try {
              const response = await fetch(`/api/setup/${encodeURIComponent(form.dataset.command)}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ values }),
              });
              if (!response.ok) {
                const payload = await response.json();
                throw new Error(payload.detail || "Setup update failed");
              }
              state = await response.json();
              form.reset();
              render();
            } catch (problem) {
              error.textContent = problem instanceof Error ? problem.message : "Setup update failed";
              error.hidden = false;
            } finally {
              button.disabled = false;
            }
          });
        });
      }

      function renderDots() {
        stepDots.replaceChildren();
        state.integrations.forEach((item, index) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = `step-dot ${item.configured ? "done" : ""} ${index === active && view === "wizard" ? "active" : ""}`;
          dot.title = item.name;
          dot.addEventListener("click", () => setActive(index));
          stepDots.appendChild(dot);
        });
      }

      function setActive(index) {
        active = Math.max(0, Math.min(index, state.integrations.length - 1));
        localStorage.setItem("lup-dashboard-step", String(active));
        render();
      }

      function setView(next) {
        view = next;
        localStorage.setItem("lup-dashboard-view", view);
        render();
      }

      function render() {
        if (!state) return;
        active = Math.min(active, Math.max(0, state.integrations.length - 1));
        progressCount.textContent = `${state.configured} / ${state.total}`;
        progressFill.style.width = state.total ? `${state.configured / state.total * 100}%` : "0";
        wizardButton.classList.toggle("active", view === "wizard");
        allButton.classList.toggle("active", view === "all");
        renderDots();

        if (view === "all") {
          content.innerHTML = state.integrations.map(integrationMarkup).join("");
        } else if (state.integrations.length) {
          const item = state.integrations[active];
          content.innerHTML = `${integrationMarkup(item)}<nav class="nav"><button id="previous" class="secondary" type="button" ${active === 0 ? "disabled" : ""}>Back</button><div class="nav-right"><button id="skip" class="secondary" type="button" ${active >= state.integrations.length - 1 ? "disabled" : ""}>Skip</button><button id="next" class="primary" type="button" ${active >= state.integrations.length - 1 ? "disabled" : ""}>Next</button></div></nav>`;
          document.getElementById("previous").addEventListener("click", () => setActive(active - 1));
          document.getElementById("skip").addEventListener("click", () => setActive(active + 1));
          document.getElementById("next").addEventListener("click", () => setActive(active + 1));
        } else {
          content.innerHTML = '<div class="loading">No setup integrations are registered.</div>';
        }
        bindForms();
      }

      wizardButton.addEventListener("click", () => setView("wizard"));
      allButton.addEventListener("click", () => setView("all"));

      fetch("/api/setup")
        .then((response) => {
          if (!response.ok) throw new Error("Could not load setup registry");
          return response.json();
        })
        .then((payload) => { state = payload; render(); })
        .catch((problem) => { content.innerHTML = `<p class="error">${escapeHtml(problem.message)}</p>`; });
    </script>
  </body>
</html>
